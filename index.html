function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}
function formatINR(n) {
  const num = Number(n) || 0;
  const neg = num < 0;
  const abs = Math.abs(num);
  const parts = abs.toFixed(2).split(".");
  let intPart = parts[0];
  let lastThree = intPart.slice(-3);
  let other = intPart.slice(0, -3);
  if (other !== "") lastThree = "," + lastThree;
  const formatted = other.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
  return (neg ? "-" : "") + "\u20B9" + formatted;
}
function formatINRShort(n) {
  const num = Number(n) || 0;
  const abs = Math.abs(num);
  if (abs >= 10000000) return (num / 10000000).toFixed(2) + "Cr";
  if (abs >= 100000) return (num / 100000).toFixed(2) + "L";
  if (abs >= 1000) return (num / 1000).toFixed(1) + "k";
  return num.toFixed(0);
}
function monthKey(dateStr) {
  return dateStr.slice(0, 7);
} // YYYY-MM
function fyMonthLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-US", {
    month: "short",
    year: "2-digit"
  });
}
function fmtDateHuman(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("en-GB", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function fyRange(fyStartYear) {
  return {
    start: `${fyStartYear}-04-01`,
    end: `${fyStartYear + 1}-03-31`
  };
}
function fyMonths(fyStartYear) {
  const months = [];
  for (let i = 0; i < 12; i++) {
    const y = i < 9 ? fyStartYear : fyStartYear + 1;
    const m = (3 + i) % 12 + 1;
    months.push(`${y}-${String(m).padStart(2, "0")}`);
  }
