function downloadDataAsExcel(transactions, loans, budgets, reminders) {
  function arrayToCSV(headers, data) {
    const csvHeaders = headers.map(h => `"${h}"`).join(",");
    const csvRows = data.map(row => 
      headers.map(h => {
        const val = String(row[h] || "");
        return `"${val.replace(/"/g, '""')}"`;
      }).join(",")
    );
    return [csvHeaders, ...csvRows].join("\n");
  }

  const date = new Date().toISOString().split("T")[0];
  const timestamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, -5);
  
  // Create Excel-like format with multiple sheets as separate CSVs
  const exportData = {
    "Transactions.csv": arrayToCSV(TX_HEADERS, transactions),
    "Loans.csv": arrayToCSV(LOAN_HEADERS, loans),
    "Reminders.csv": arrayToCSV(REMINDER_HEADERS, reminders),
    "Budgets.csv": "Category,Amount\n" + Object.entries(budgets || {}).map(([cat, amt]) => `"${cat}",${amt}`).join("\n")
  };

  // Create a ZIP-like structure or just download as text
  // For simplicity, we'll create a comprehensive JSON file that can be opened in Excel
  const allData = {
    exportDate: new Date().toISOString(),
    transactions,
    loans,
    budgets,
    reminders
  };

  const dataStr = JSON.stringify(allData, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `Ledger-Backup-${timestamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const ITOS_DOCUMENT = "\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"UTF-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n\u003ctitle\u003eITOS v3.0 — Institutional Trading OS\u003c/title\u003e\n\u003cstyle\u003e\n*{box-sizing:border-box;margin:0;padding:0}\n:root{\n  --bg:#07090f;--bg2:#0d1220;--bg3:#111827;--bg4:#1a2236;--bg5:#222d42;\n  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);--border3:rgba(255,255,255,0.18);\n  --text:#e4e2dd;--text2:#8b9ab0;--text3:#4a5568;--text4:#2d3748;\n  --accent:#2563eb;--accent2:#1d4ed8;--glow:rgba(37,99,235,0.15);\n  --green:#10b981;--green2:rgba(16,185,129,0.12);\n  --red:#ef4444;--red2:rgba(239,68,68,0.12);\n  --amber:#f59e0b;--amber2:rgba(245,158,11,0.1);\n  --purple:#7c3aed;--purple2:rgba(124,58,237,0.1);\n  --teal:#0d9488;--teal2:rgba(13,148,136,0.1);\n  --elite:#fbbf24;--elite2:rgba(251,191,36,0.1);\n  --cyan:#06b6d4;--cyan2:rgba(6,182,212,0.08);\n  --pink:#ec4899;\n}\nhtml{font-size:12px;font-family:\u0027SF Mono\u0027,\u0027Fira Code\u0027,monospace}\nbody{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}\n\n/* ── HEADER */\n.hdr{position:fixed;top:0;left:0;right:0;z-index:300;height:46px;\n  background:rgba(7,9,15,0.96);border-bottom:1px solid var(--border2);\n  backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 16px;gap:12px}\n.logo-mark{width:26px;height:26px;border-radius:6px;\n  background:linear-gradient(135deg,#2563eb,#7c3aed);\n  display:flex;align-items:center;justify-content:center;\n  font-size:11px;font-weight:800;color:#fff;letter-spacing:-1px;flex-shrink:0}\n.logo-text{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}\n.logo-sub{font-size:8px;color:var(--text3);letter-spacing:0.5px}\n.hdr-div{width:1px;height:22px;background:var(--border2);flex-shrink:0}\n.hdr-pills{display:flex;gap:6px;align-items:center}\n.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}\n.hdr-clock{font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums;letter-spacing:0.3px}\n.hdr-date{font-size:9px;color:var(--text3);text-align:right}\n\n/* ── PILL */\n.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;\n  font-size:9px;font-weight:700;letter-spacing:0.4px}\n.pill-live{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.25)}\n.pill-closed{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)}\n.pill-mcp{background:rgba(37,99,235,0.12);color:#60a5fa;border:1px solid rgba(37,99,235,0.25)}\n.pill-ai{background:rgba(124,58,237,0.12);color:#a78bfa;border:1px solid rgba(124,58,237,0.25)}\n.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}\n.dot-g{background:var(--green);box-shadow:0 0 5px var(--green);animation:blink 2s infinite}\n.dot-r{background:var(--red)}\n@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}\n\n/* ── LAYOUT */\n.layout{display:flex;padding-top:46px;min-height:100vh}\n\n/* ── SIDEBAR */\n.sidebar{width:196px;flex-shrink:0;background:var(--bg2);\n  border-right:1px solid var(--border);\n  position:fixed;top:46px;left:0;bottom:0;overflow-y:auto;z-index:200}\n.sb-section{font-size:8px;color:var(--text3);letter-spacing:1.5px;\n  text-transform:uppercase;padding:14px 14px 4px;font-weight:700}\n.nav{display:flex;align-items:center;gap:7px;padding:7px 14px;cursor:pointer;\n  transition:all 0.15s;font-size:10px;color:var(--text3);\n  border-left:2px solid transparent;font-weight:500;white-space:nowrap}\n.nav:hover{color:var(--text2);background:rgba(255,255,255,0.02)}\n.nav.on{color:#60a5fa;background:rgba(37,99,235,0.08);border-left-color:var(--accent)}\n.nav svg{width:13px;height:13px;opacity:.7;flex-shrink:0}\n.nb{margin-left:auto;font-size:8px;padding:1px 5px;border-radius:8px;\n  background:var(--bg4);color:var(--text3);font-variant-numeric:tabular-nums}\n.nb.active{background:rgba(37,99,235,0.18);color:#60a5fa}\n\n/* ── CONTENT */\n.content{margin-left:196px;padding:18px;min-height:calc(100vh - 46px)}\n.pg{display:none}.pg.on{display:block}\n.pg-title{font-size:13px;font-weight:700;margin-bottom:2px}\n.pg-sub{font-size:9px;color:var(--text3);margin-bottom:16px;letter-spacing:0.3px}\n\n/* ── CARDS */\n.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}\n.card2{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px}\n.ch{font-size:8px;font-weight:700;color:var(--text3);letter-spacing:1.2px;\n  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:5px}\n.ch-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}\n\n/* ── GRIDS */\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}\n.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}\n.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}\n.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}\n.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}\n@media(max-width:1400px){.g7{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(3,1fr)}}\n@media(max-width:1100px){.g5,.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}\n.gap{margin-top:12px}\n\n/* ── KPI */\n.kpi{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:11px 13px}\n.kpi-lbl{font-size:8px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}\n.kpi-val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}\n.kpi-chg{font-size:9px;margin-top:3px;font-variant-numeric:tabular-nums}\n.kpi-sub{font-size:9px;color:var(--text3);margin-top:2px}\n.up{color:var(--green)}.dn{color:var(--red)}.nt{color:var(--amber)}\n\n/* ── TABLES */\n.tw{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:10px}\nth{text-align:left;padding:6px 9px;color:var(--text3);font-weight:700;font-size:8px;\n  letter-spacing:.7px;text-transform:uppercase;border-bottom:1px solid var(--border2);\n  white-space:nowrap;background:var(--bg3);position:sticky;top:0}\ntd{padding:8px 9px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}\ntr:hover td{background:rgba(255,255,255,0.02)}\ntr:last-child td{border:none}\n.tr{text-align:right}.tc{text-align:center}\n\n/* ── ACTION PILLS */\n.ap{display:inline-block;padding:2px 6px;border-radius:3px;font-size:8px;font-weight:700;letter-spacing:.3px}\n.a-buy{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.25)}\n.a-sell{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.25)}\n.a-hold{background:rgba(245,158,11,0.12);color:#fcd34d;border:1px solid rgba(245,158,11,0.2)}\n.a-exit{background:rgba(239,68,68,0.2);color:#fca5a5}\n.a-add{background:rgba(16,185,129,0.18);color:#6ee7b7}\n.a-watch{background:rgba(124,58,237,0.15);color:#c4b5fd}\n.a-bull{background:rgba(16,185,129,0.1);color:var(--green)}\n.a-bear{background:rgba(239,68,68,0.1);color:var(--red)}\n.a-neut{background:rgba(245,158,11,0.1);color:var(--amber)}\n.a-elite{background:rgba(251,191,36,0.15);color:var(--elite);border:1px solid rgba(251,191,36,.3)}\n.a-high{background:rgba(37,99,235,0.15);color:#93c5fd;border:1px solid rgba(37,99,235,.3)}\n.a-good{background:rgba(13,148,136,0.15);color:#5eead4}\n\n/* ── REGIME BANNER */\n.regime{border-radius:10px;padding:14px 16px;margin-bottom:14px;\n  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}\n.reg-bull{background:linear-gradient(135deg,rgba(16,185,129,.09),rgba(16,185,129,.02));border:1px solid rgba(16,185,129,.18)}\n.reg-bear{background:linear-gradient(135deg,rgba(239,68,68,.09),rgba(239,68,68,.02));border:1px solid rgba(239,68,68,.18)}\n.reg-neut{background:linear-gradient(135deg,rgba(245,158,11,.09),rgba(245,158,11,.02));border:1px solid rgba(245,158,11,.18)}\n.reg-title{font-size:14px;font-weight:700;letter-spacing:-.3px}\n.reg-meta{font-size:9px;color:var(--text2);margin-top:3px}\n\n/* ── BARS */\n.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}\n.bar-name{font-size:9px;color:var(--text2);width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.bar-track{flex:1;background:var(--bg4);border-radius:2px;height:3px;overflow:hidden}\n.bar-fill{height:100%;border-radius:2px;transition:width .7s cubic-bezier(.4,0,.2,1)}\n.bar-val{font-size:9px;font-variant-numeric:tabular-nums;width:34px;text-align:right;flex-shrink:0}\n\n/* ── CHECK ROWS */\n.cr{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--border);font-size:9px}\n.cr:last-child{border:none}\n.ci{width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;flex-shrink:0}\n.ci-ok{background:rgba(16,185,129,.2);color:var(--green)}\n.ci-warn{background:rgba(245,158,11,.2);color:var(--amber)}\n.ci-fail{background:rgba(239,68,68,.2);color:var(--red)}\n.cr-lbl{flex:1;color:var(--text2)}\n.cr-val{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}\n\n/* ── ALERTS */\n.alert{padding:9px 13px;border-radius:7px;font-size:10px;margin-bottom:10px;line-height:1.6}\n.al-i{background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.18);color:#93c5fd}\n.al-w{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.18);color:#fcd34d}\n.al-ok{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.18);color:#6ee7b7}\n.al-e{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);color:#fca5a5}\n\n/* ── SMART MONEY BLOCKS */\n.smb{border-left:3px solid;padding:7px 9px;border-radius:0 6px 6px 0;margin-bottom:5px;font-size:9px;line-height:1.6}\n.smb-bull{border-color:var(--green);background:rgba(16,185,129,.05)}\n.smb-bear{border-color:var(--red);background:rgba(239,68,68,.05)}\n.smb-neut{border-color:var(--amber);background:rgba(245,158,11,.05)}\n.smb-purple{border-color:var(--purple);background:rgba(124,58,237,.05)}\n.smb-cyan{border-color:var(--cyan);background:rgba(6,182,212,.05)}\n\n/* ── STAGE LOADERS */\n.sl{background:var(--bg3);border:1px solid var(--border);border-radius:7px;\n  padding:10px 13px;margin-bottom:5px;display:flex;align-items:center;gap:9px}\n.sp{width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--accent);\n  border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}\n@keyframes spin{to{transform:rotate(360deg)}}\n.sl.done .sp{display:none}\n.sl.done .chk{display:flex}\n.chk{width:15px;height:15px;border-radius:50%;background:rgba(16,185,129,.2);\n  color:var(--green);font-size:8px;align-items:center;justify-content:center;display:none;flex-shrink:0}\n.sl-info{flex:1}\n.sl-name{font-size:10px;font-weight:600}\n.sl-det{font-size:8px;color:var(--text3);margin-top:1px}\n.sl-count{font-size:9px;color:var(--text2);font-variant-numeric:tabular-nums;flex-shrink:0}\n\n/* ── SCORE ITEMS */\n.sc-item{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px}\n.sc-lbl{font-size:8px;color:var(--text3);letter-spacing:.3px;margin-bottom:3px}\n.sc-val{font-size:14px;font-weight:700}\n.sc-bar{height:2px;border-radius:1px;margin-top:4px;transition:width .6s}\n\n/* ── TRADE CARD */\n.tc-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:13px}\n.tc-head{padding:11px 14px;border-bottom:1px solid var(--border);\n  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}\n.tc-body{padding:13px}\n.tc-sym{font-size:16px;font-weight:800;letter-spacing:-.5px}\n.tc-sect{font-size:9px;color:var(--text2);margin-top:1px}\n\n/* ── LEVEL GRID */\n.lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:10px}\n.lv{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px}\n.lv-l{font-size:8px;color:var(--text3);margin-bottom:2px}\n.lv-v{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}\n\n/* ── ENTRY MATRIX */\n.em{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:6px;overflow:hidden}\n.em-c{background:var(--bg3);padding:9px;text-align:center}\n.em-l{font-size:8px;color:var(--text3);margin-bottom:3px}\n.em-v{font-size:11px;font-weight:700}\n.em-s{font-size:8px;color:var(--text3);margin-top:1px}\n\n/* ── EXEC STEPS */\n.ex-step{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}\n.ex-step:last-child{border:none}\n.ex-num{width:18px;height:18px;border-radius:50%;border:1px solid var(--border2);\n  display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text3);flex-shrink:0}\n.ex-txt{font-size:9px;color:var(--text2);line-height:1.6}\n\n/* ── CONF METER */\n.cm{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}\n.cm-fill{height:100%;border-radius:2px;transition:width .8s}\n\n/* ── HEAT BAR */\n.heat{height:10px;border-radius:5px;overflow:hidden;\n  background:linear-gradient(90deg,var(--green),var(--amber),var(--red));position:relative}\n.heat-mk{position:absolute;top:-2px;width:2px;height:14px;background:#fff;\n  border-radius:1px;box-shadow:0 0 4px rgba(0,0,0,.5)}\n\n/* ── HEATMAP CELL */\n.hmc{padding:7px 5px;text-align:center;border-radius:5px;font-size:9px;font-weight:700}\n\n/* ── LOG */\n.logbox{background:var(--bg);border:1px solid var(--border);border-radius:7px;\n  padding:10px;font-family:\u0027SF Mono\u0027,monospace;font-size:9px;color:var(--text2);\n  max-height:280px;overflow-y:auto;line-height:1.9}\n.lt{color:var(--text3)}.lok{color:var(--green)}.lwarn{color:var(--amber)}\n.lerr{color:var(--red)}.linfo{color:#60a5fa}.lsys{color:var(--purple)}\n\n/* ── BUTTONS */\n.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;\n  font-size:10px;font-weight:600;cursor:pointer;border:none;transition:all .15s;letter-spacing:.2px}\n.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent2)}\n.btn-o{background:transparent;color:var(--text2);border:1px solid var(--border2)}\n.btn-o:hover{border-color:var(--accent);color:#60a5fa}\n.btn-sm{padding:4px 9px;font-size:9px}\n.btn-g{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3)}\n.btn-e{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}\n\n/* ── FLEX */\n.fx{display:flex;align-items:center;gap:7px}\n.fxb{display:flex;align-items:center;justify-content:space-between}\n.div{height:1px;background:var(--border);margin:10px 0}\n\n/* ── SCROLLBAR */\n::-webkit-scrollbar{width:3px;height:3px}\n::-webkit-scrollbar-track{background:transparent}\n::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}\n\n/* ── INPUT */\n.inp{background:var(--bg3);border:1px solid var(--border2);color:var(--text);\n  padding:6px 10px;border-radius:6px;font-size:10px;outline:none;\n  font-family:inherit}\n.inp:focus{border-color:var(--accent)}\nselect.inp option{background:var(--bg2)}\n\n/* ── CHIP */\n.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;\n  border-radius:3px;font-size:8px;background:var(--bg4);\n  color:var(--text2);border:1px solid var(--border)}\n\n/* ── MTF BADGES */\n.mtfb{padding:2px 7px;border-radius:3px;font-size:8px;font-weight:700;letter-spacing:.3px}\n.mtf-bull{background:rgba(16,185,129,.14);color:#34d399}\n.mtf-bear{background:rgba(239,68,68,.14);color:#f87171}\n.mtf-neut{background:rgba(245,158,11,.1);color:#fcd34d}\n\n/* ── ETF RATING STAR */\n.stars{color:var(--elite);font-size:10px;letter-spacing:1px}\n\n/* ── PORTFOLIO ALLOC RING (CSS) */\n.alloc-ring{width:100px;height:100px;border-radius:50%;\n  background:conic-gradient(var(--green) 0% 35%, var(--accent) 35% 55%, var(--amber) 55% 70%, var(--purple) 70% 82%, var(--red) 82% n  \u003cdiv id=\"btOut\"\u003e\u003cdiv class=\"alert al-i\"\u003eBacktest insights load from historical ITOS signal data.\u003c/div\u003e\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c!-- ══ PAGE 17: LOG --\u003e\n\u003cdiv class=\"pg\" id=\"p17\"\u003e\n  \u003cdiv class=\"pg-title\"\u003eSystem Log\u003c/div\u003e\n  \u003cdiv class=\"pg-sub\"\u003eITOS execution trace · Zerodha MCP API calls · AI inference log\u003c/div\u003e\n  \u003cdiv class=\"logbox\" id=\"logbox\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"fx gap\" style=\"gap:8px\"\u003e\n    \u003cbutton class=\"btn btn-o btn-sm\" onclick=\"document.getElementById(\u0027logbox\u0027).innerHTML=\u0027\u0027\"\u003eClear\u003c/button\u003e\n    \u003cbutton class=\"btn btn-o btn-sm\" onclick=\"init()\"\u003e↺ Full Refresh\u003c/button\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\u003c!-- content --\u003e\n\u003c/div\u003e\u003c!-- layout --\u003e\n\u003cscript\u003e\n// ══════════════════════════════════════════════════════════════\n// ITOS v3.0 ADVANCED — Complete Engine\n// ══════════════════════════════════════════════════════════════\nconst API=\u0027https://api.anthropic.com/v1/messages\u0027;\nconst MCP_URL=\u0027https://github.com/zerodha/kite-mcp-server%20cd%20kite-mcp-server\u0027;\n\n// ── Helpers\nconst inr=v=\u003ev!=null?\u0027₹\u0027+(+v).toLocaleString(\u0027en-IN\u0027,{maximumFractionDigits:2}):\u0027—\u0027;\nconst pct=(v,d=2)=\u003ev!=null?((+v)\u003e=0?\u0027+\u0027:\u0027\u0027)+((+v).toFixed(d))+\u0027%\u0027:\u0027—\u0027;\nconst num=(v,d=2)=\u003ev!=null?(+v).toFixed(d):\u0027—\u0027;\nconst sc=v=\u003ev\u003e=8.5?\u0027var(--green)\u0027:v\u003e=7?\u0027var(--teal)\u0027:v\u003e=5?\u0027var(--amber)\u0027:\u0027var(--red)\u0027;\nconst pc=v=\u003ev\u003e=95?\u0027var(--elite)\u0027:v\u003e=90?\u0027var(--green)\u0027:v\u003e=80?\u0027var(--amber)\u0027:\u0027var(--red)\u0027;\nconst clr=v=\u003e(+v)\u003e=0?\u0027var(--green)\u0027:\u0027var(--red)\u0027;\nconst bar=(pct,color)=\u003e`\u003cdiv class=\"bar-track\"\u003e\u003cdiv class=\"bar-fill\" style=\"width:${Math.min(Math.abs(pct),100)}%;background:${color}\"\u003e\u003c/div\u003e\u003c/div\u003e`;\n\n// ── Clock\nfunction tick(){\n  const now=new Date(),ist=new Date(now.getTime()+5.5*3600000);\n  const p=n=\u003eString(n).padStart(2,\u00270\u0027);\n  document.getElementById(\u0027clock\u0027).textContent=`${p(ist.getUTCHours())}:${p(ist.getUTCMinutes())}:${p(ist.getUTCSeconds())} IST`;\n  const ds=[\u0027Sun\u0027,\u0027Mon\u0027,\u0027Tue\u0027,\u0027Wed\u0027,\u0027Thu\u0027,\u0027Fri\u0027,\u0027Sat\u0027],ms=[\u0027Jan\u0027,\u0027Feb\u0027,\u0027Mar\u0027,\u0027Apr\u0027,\u0027May\u0027,\u0027Jun\u0027,\u0027Jul\u0027,\u0027Aug\u0027,\u0027Sep\u0027,\u0027Oct\u0027,\u0027Nov\u0027,\u0027Dec\u0027];\n  document.getElementById(\u0027dateD\u0027).textContent=`${ds[ist.getUTCDay()]}, ${ist.getUTCDate()} ${ms[ist.getUTCMonth()]} ${ist.getUTCFullYear()}`;\n  const h=ist.getUTCHours(),m=ist.getUTCMinutes(),wd=ist.getUTCDay();\n  const open=h\u003e=9\u0026\u0026(h\u003c15||(h===15\u0026\u0026m\u003c30))\u0026\u0026wd\u003e=1\u0026\u0026wd\u003c=5;\n  const dot=document.getElementById(\u0027mktDot\u0027),pill=document.getElementById(\u0027mktPill\u0027),txt=document.getElementById(\u0027mktTxt\u0027);\n  dot.className=\u0027dot \u0027+(open?\u0027dot-g\u0027:\u0027dot-r\u0027);\n  pill.className=\u0027pill \u0027+(open?\u0027pill-live\u0027:\u0027pill-closed\u0027);\n  txt.textContent=open?\u0027Market Open\u0027:(h\u003e=15||h\u003c9)?\u0027Market Closed\u0027:\u0027Pre-Market\u0027;\n}\nsetInterval(tick,1000);\n\n// ── Log\nfunction log(t,msg){\n  const ts=new Date().toLocaleTimeString(\u0027en-IN\u0027,{hour12:false});\n  const c=t===\u0027OK\u0027?\u0027lok\u0027:t===\u0027WARN\u0027?\u0027lwarn\u0027:t===\u0027ERR\u0027?\u0027lerr\u0027:t===\u0027SYS\u0027?\u0027lsys\u0027:\u0027linfo\u0027;\n  const b=document.getElementById(\u0027logbox\u0027);\n  b.innerHTML+=`\u003
